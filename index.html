<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schools — SansBorder</title>
<meta name="description" content="Nine worlds of knowledge turn around you. Choose a School to enter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/schools.css">
<script src="assets/js/school-worlds.js" defer></script>
<script src="assets/js/schools.js" defer></script>
</head>
<body>
<div class="page">
  <a class="skip" href="#world">Skip to the selected School</a>

  <section class="universe" id="universe" aria-labelledby="u-title">
    <div class="dial" id="dial">
      <canvas id="dial-canvas" aria-hidden="true"></canvas>
      <div class="dial-nodes" id="dial-nodes" role="group" aria-label="The nine Schools"></div>
    </div>

    <header class="top">
      <a class="brand" href="index.html" aria-label="SansBorder home">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2.5H2.5V21.5H21.5V11" fill="none" stroke="#f3f2f2" stroke-width="2.5"></path><path d="M7.5 16.5L22.5 1.5" stroke="#ec3013" stroke-width="2.5"></path></svg>
        <span class="brand-word"><b>Sans</b>Border</span>
      </a>
      <nav class="primary" aria-label="Primary">
        <a href="index.html" aria-current="page">Schools</a>
        <a href="learner.html">My world</a>
      </nav>
    </header>

    <div class="caption" id="caption">
      <h1 id="u-title">Nine worlds turn around you.</h1>
      <p id="how-to"></p>
    </div>

    <article class="world" id="world" aria-labelledby="w-name" aria-live="polite">
      <div class="world-art" id="world-art">
        <canvas id="world-canvas" aria-hidden="true"></canvas>
        <span class="world-count">SCHOOL <span id="w-num">01</span> OF 09</span>
        <span class="world-drawn" id="w-drawn"></span>
      </div>
      <div class="world-body">
        <h2 id="w-name"></h2>
        <p class="world-desc" id="w-desc"></p>
        <div class="world-topics" id="w-topics"></div>
        <div class="world-rel">
          <span class="label">CROSSES INTO</span>
          <span class="world-rel-list" id="w-rel"></span>
        </div>
        <div class="world-actions">
          <a class="enter" id="w-enter" href="#world">Enter the School<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
          <span class="stepper">
            <button type="button" id="prev" aria-label="Previous School"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
            <button type="button" id="next" aria-label="Next School"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
          </span>
        </div>
      </div>
    </article>
  </section>

  <nav class="every" id="every" aria-label="Every School, by number">
    <span class="label">EVERY WORLD</span>
  </nav>
</div>
</body>
</html>
